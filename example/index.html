<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>@fazelstudio/codemirror-stickyscroll — demo</title>
    <style>
      body {
        margin: 0;
        font-family: system-ui, sans-serif;
        background: #1e1e1e;
        color: #ccc;
        height: 100vh;
        display: flex;
        flex-direction: column;
      }
      header {
        display: flex;
        gap: 8px;
        align-items: center;
        padding: 8px 12px;
        background: #252526;
        border-bottom: 1px solid #333;
      }
      header h1 {
        font-size: 14px;
        margin: 0 16px 0 0;
        font-weight: 600;
      }
      header button {
        background: #333;
        color: #ccc;
        border: 1px solid #444;
        border-radius: 4px;
        padding: 4px 10px;
        cursor: pointer;
        font-size: 12px;
      }
      header button:hover {
        background: #444;
      }
      header label {
        font-size: 12px;
        display: flex;
        align-items: center;
        gap: 4px;
        margin-left: auto;
      }
      #editor {
        flex: 1;
        overflow: hidden;
        font-size: 14px;
      }
      .cm-editor {
        height: 100%;
      }
      .cm-editor .cm-scroller {
        font-family: ui-monospace, SFMono-Regular, "SF Mono", Menlo, Consolas,
          "Liberation Mono", monospace;
      }
    </style>
  </head>
  <body>
    <header>
      <h1>sticky scroll demo</h1>
      <button id="theme">toggle dark theme</button>
      <button id="reload">reload doc</button>
      <label><input type="checkbox" id="sticky" checked /> sticky scroll</label>
    </header>
    <div id="editor"></div>
    <script type="module" src="./main.ts"></script>
  </body>
</html>
